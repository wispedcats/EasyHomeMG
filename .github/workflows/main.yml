name: count numbers

on:
  push:
    branches: [ main ]

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: cloc installieren und ausführen
        run: |
          sudo apt-get update
          sudo apt-get install -y cloc
          cloc .
