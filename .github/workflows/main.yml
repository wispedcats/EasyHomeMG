name: Lines of Code Badge

on:
  push:
    branches: [ main ]

jobs:
  badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Crucial for pushing the updated README back to your repo
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: cloc installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y cloc

      - name: Zeilen zaehlen und README aktualisieren
        run: |
          # 1. Count only actual code lines (excluding blanks and comments)
          LINES=$(cloc . --json | jq '.SUM.code')
          echo "Found $LINES lines of code."
          
          # 2. Generate the Shields.io badge URL
          BADGE_URL="https://shields.io"
          BADGE_MARKDOWN="![Lines of Code]($BADGE_URL)"
          
          # 3. Inject the badge into the README placeholder
          sed -i "/<!-- lines_of_code_start -->/,/<!-- lines_of_code_end -->/{//!d;}" README.md
          sed -i "/<!-- lines_of_code_start -->/a $BADGE_MARKDOWN" README.md

      - name: Aenderungen committen und pushen
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: update lines of code badge [skip ci]" && git push)
