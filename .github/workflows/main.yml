name: Lines of Code Badge

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cloc jq

      - name: Count lines of code
        run: |
          LINES=$(cloc . \
            --json \
            --exclude-dir=.git,node_modules,dist,build,.venv,venv \
            | jq -r '.SUM.code // 0')

          echo "Lines of code: $LINES"

          BADGE="![Lines of Code](https://img.shields.io/badge/Lines_of_Code-${LINES}-blue)"

          if grep -q "<!-- lines_of_code_start -->" README.md && \
             grep -q "<!-- lines_of_code_end -->" README.md; then

            sed -i "/<!-- lines_of_code_start -->/,/<!-- lines_of_code_end -->/c\\
          <!-- lines_of_code_start -->\\
          $BADGE\\
          <!-- lines_of_code_end -->" README.md

          else
            printf '\n<!-- lines_of_code_start -->\n%s\n<!-- lines_of_code_end -->\n' "$BADGE" >> README.md
          fi

      - name: Commit updated README
        run: |
          if git diff --quiet README.md; then
            echo "README is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "docs: update lines of code badge"
          git push
