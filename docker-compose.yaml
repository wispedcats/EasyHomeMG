version: '3.9'
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
      - node-api
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npm install && npm run dev"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      - DATABASE_URL
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/usr/src/app
    depends_on:
      - db

  node-api:
    build:
      context: ./backend/node
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '8001:8001'
    env_file:
      - .env
    environment:
      - DATABASE_URL
    volumes:
      - ./backend/node:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - db
    command: sh -c "npm install && npm run dev"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: {}
